[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robofrontier-matrix"
version = "0.1.0"
description = "A sourced, machine-checkable matrix of open problems in embodied AI and robotics software, 2025 to Sept 2026."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Gaus Mohiuddin Sayyad"}]
dependencies = ["pyyaml>=5.4"]

[project.scripts]
opmatrix = "opmatrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opmatrix = []
